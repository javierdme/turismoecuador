<!-- explorar.html -->
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Destinos Turísticos | Turismo Ecuador</title>

    <!-- GOOGLE FONTS -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- CSS PRINCIPAL -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- CSS EXPLORAR -->
    <link
        rel="stylesheet"
        href="css/explorar.css"
    >

</head>

<body>

<header>

    <nav>

        <ul>

            <li>
                <a href="index.html">
                    Inicio
                </a>
            </li>

            <li>
                <a href="nosotros.html">
                    Nosotros
                </a>
            </li>

            <li>
                <a href="contacto.html">
                    Contacto
                </a>
            </li>

            <li>
                <a href="explorar.html" class="activo">
                    Explorar Destinos
                </a>
            </li>

        </ul>

    </nav>

</header>

<main>

    <!-- HERO -->

    <section class="hero">

        <h2>
            Destinos Turísticos del Ecuador
        </h2>

        <p>
            Explora destinos ecuatorianos usando
            información dinámica desde Wikipedia REST API.
        </p>

    </section>

    <!-- BUSQUEDA -->

    <section class="explorar-section">

        <div class="busqueda-container">

            <input
                type="text"
                id="inputPais"
                placeholder="Busca Quito, Baños, Galápagos..."
            >

        </div>

        <!-- ESTADOS -->

        <div id="estado"></div>

        <!-- TARJETAS -->

        <div id="contenedorTarjetas"></div>

    </section>

</main>

<!-- MODAL -->

<div id="modal" class="modal oculto">

    <div class="modal-contenido">

        <button
            id="cerrarModal"
            class="cerrar-modal"
        >

            <i class="fas fa-times"></i>

        </button>

        <div id="detallePais"></div>

    </div>

</div>

<footer>

    <p>
        &copy; 2026 Turismo Ecuador.
        Todos los derechos reservados.
    </p>

    <p>
        Quito - Ecuador
    </p>

</footer>

<script src="js/app.js"></script>

</body>
</html>
