<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar Países</title>

    <link rel="stylesheet" href="css/explorar.css">
</head>

<body>

    <header>
        <h1>Explora Países Turísticos</h1>
    </header>

    <main>

        <section class="busqueda">

            <input
                type="text"
                id="inputPais"
                placeholder="Escribe un país"
            >

            <button id="btnBuscar">
                Buscar
            </button>

        </section>

        <section id="estado"></section>

        <section id="contenedorTarjetas"></section>

    </main>

    <!-- MODAL -->
    <div id="modal" class="modal oculto">

        <div class="modal-contenido">

            <button id="cerrarModal">
                X
            </button>

            <div id="detallePais"></div>

        </div>

    </div>

    <script src="js/app.js"></script>

</body>
</html>
